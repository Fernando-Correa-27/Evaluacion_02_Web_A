<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Recuperar contraseña')}"></head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-key"></i></div>
        <h1>Recuperar contraseña</h1>
        <p class="muted">Ingrese el correo asociado a su cuenta para generar un enlace de recuperación</p>

        <div th:if="${error}" class="alert alert-pastel-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-pastel-success" th:text="${mensaje}"></div>
        <div th:if="${enlace}" class="alert alert-pastel-success">
            <div>Enlace de recuperación (entorno de prueba):</div>
            <a class="link-pastel" th:href="${enlace}" th:text="${enlace}"></a>
        </div>

        <form th:action="@{/recuperar}" method="post">
            <div class="mb-3">
                <label class="form-label" for="correo">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="correo" name="correo" th:value="${correo != null} ? ${correo} : ''" placeholder="correo@ejemplo.com" required>
                </div>
            </div>
            <button type="submit" class="btn btn-pastel-primary w-100">Generar enlace</button>
        </form>

        <div class="text-center mt-4">
            <a class="link-pastel" th:href="@{/login}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
