<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Restablecer contraseña')}"></head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-shield-lock"></i></div>
        <h1>Nueva contraseña</h1>
        <p class="muted">Defina la nueva contraseña para su cuenta</p>

        <form th:action="@{/restablecer}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label" for="password">Nueva contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
            </div>
            <button type="submit" class="btn btn-pastel-primary w-100">Restablecer contraseña</button>
        </form>

        <div class="text-center mt-4">
            <a class="link-pastel" th:href="@{/login}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
