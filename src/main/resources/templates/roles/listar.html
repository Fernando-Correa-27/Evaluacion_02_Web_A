<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Roles y permisos')}"></head>
<body>
    <div class="app-layout">
        <nav th:replace="~{fragments/panel :: menu('roles')}"></nav>
        <div class="app-main">
            <header th:replace="~{fragments/panel :: topbar}"></header>
            <main class="content">
                <div class="page-header">
                    <div>
                        <h1>Roles y permisos</h1>
                        <p>Administre los roles del sistema y los permisos asignados a cada uno</p>
                    </div>
                    <div class="page-actions" th:if="${#sets.contains(session.permisosSesion, 'ROLES:CREAR')}">
                        <a class="btn btn-pastel-primary" th:href="@{/roles/nuevo}">
                            <i class="bi bi-plus-lg"></i> Nuevo rol
                        </a>
                    </div>
                </div>

                <div th:if="${exito}" class="alert alert-pastel-success" th:text="${exito}"></div>
                <div th:if="${error}" class="alert alert-pastel-danger" th:text="${error}"></div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Rol</th>
                                    <th>Descripción</th>
                                    <th>Permisos</th>
                                    <th>Usuarios</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="rol : ${roles}">
                                    <td>
                                        <div th:text="${rol.nombre}">Rol</div>
                                        <small class="text-muted">Creado: <span th:text="${#temporals.format(rol.fechaCreacion, 'dd/MM/yyyy')}">-</span></small>
                                    </td>
                                    <td th:text="${rol.descripcion != null} ? ${rol.descripcion} : '-'">Descripción</td>
                                    <td>
                                        <span class="badge badge-pastel-lavender" th:text="${rol.permisos.size() + ' permisos'}"></span>
                                    </td>
                                    <td th:text="${rol.usuarios.size()}">0</td>
                                    <td>
                                        <span class="badge" th:classappend="${rol.estado.name() == 'ACTIVO'} ? 'badge-pastel-green' : 'badge-pastel-red'"
                                              th:text="${rol.estado.name()}"></span>
                                    </td>
                                    <td class="text-end">
                                        <div class="page-actions justify-content-end">
                                            <a class="btn btn-light-soft btn-sm" th:href="@{/roles/permisos/{id}(id=${rol.id})}"
                                               th:if="${#sets.contains(session.permisosSesion, 'ROLES:EDITAR')}" title="Asignar permisos">
                                                <i class="bi bi-check2-square"></i>
                                            </a>
                                            <a class="btn btn-light-soft btn-sm" th:href="@{/roles/editar/{id}(id=${rol.id})}"
                                               th:if="${#sets.contains(session.permisosSesion, 'ROLES:EDITAR')}" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${rol.estado.name() == 'INACTIVO' and #sets.contains(session.permisosSesion, 'ROLES:EDITAR')}"
                                                  th:action="@{/roles/activar/{id}(id=${rol.id})}" method="post">
                                                <button type="submit" class="btn btn-pastel-success btn-sm" title="Activar">
                                                    <i class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                            <form th:if="${rol.estado.name() == 'ACTIVO' and #sets.contains(session.permisosSesion, 'ROLES:ELIMINAR')}"
                                                  th:action="@{/roles/desactivar/{id}(id=${rol.id})}" method="post"
                                                  data-confirm="¿Desactivar este rol?">
                                                <button type="submit" class="btn btn-pastel-danger btn-sm" title="Desactivar">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(roles)}">
                                    <td colspan="6">
                                        <div class="empty-state">
                                            <i class="bi bi-inbox"></i>
                                            <p>No hay roles registrados</p>
                                            <small>Los roles definen los permisos de acceso al sistema</small>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
