<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Roles y permisos')}"></head>
<body>
    <div class="app-layout">
        <nav th:replace="~{fragments/panel :: menu('roles')}"></nav>
        <div class="app-main">
            <header th:replace="~{fragments/panel :: topbar}"></header>
            <main class="content">
                <div class="page-header">
                    <div>
                        <h1 th:text="${titulo}">Nuevo rol</h1>
                        <p>Registre la información del rol</p>
                    </div>
                    <a class="btn btn-outline-pastel" th:href="@{/roles}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div th:if="${error}" class="alert alert-pastel-danger" th:text="${error}"></div>

                <div class="card">
                    <form th:action="@{/roles/guardar}" method="post" th:object="${rol}">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="nombre">Nombre del rol</label>
                                <input class="form-control" id="nombre" th:field="*{nombre}" minlength="3" maxlength="60" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="estado">Estado</label>
                                <select class="form-select" id="estado" th:field="*{estado}">
                                    <option th:each="estado : ${estados}" th:value="${estado.name()}" th:text="${estado.name()}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="descripcion">Descripción</label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"
                                          placeholder="Función del rol dentro del sistema"></textarea>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a class="btn btn-outline-pastel" th:href="@{/roles}">Cancelar</a>
                            <button type="submit" class="btn btn-pastel-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
