<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Roles y permisos')}"></head>
<body>
    <div class="app-layout">
        <nav th:replace="~{fragments/panel :: menu('roles')}"></nav>
        <div class="app-main">
            <header th:replace="~{fragments/panel :: topbar}"></header>
            <main class="content">
                <div class="page-header">
                    <div>
                        <h1>Asignación de permisos</h1>
                        <p th:text="${'Permisos del rol: ' + rol.nombre}"></p>
                    </div>
                    <a class="btn btn-outline-pastel" th:href="@{/roles}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div th:if="${exito}" class="alert alert-pastel-success" th:text="${exito}"></div>

                <div class="card">
                    <form th:action="@{/roles/permisos/{id}(id=${rol.id})}" method="post" th:object="${asignacion}">
                        <div th:each="entry : ${permisosPorModulo}">
                            <div class="permission-modulo">
                                <h6 th:text="${entry.key}">MODULO</h6>
                                <div class="row g-2">
                                    <div class="col-md-3 col-sm-6" th:each="permiso : ${entry.value}">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input"
                                                   th:field="*{permisoIds}" th:value="${permiso.id}"
                                                   th:id="${'perm_' + permiso.id}">
                                            <label class="form-check-label" th:for="${'perm_' + permiso.id}"
                                                   th:text="${permiso.nombre}"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a class="btn btn-outline-pastel" th:href="@{/roles}">Cancelar</a>
                            <button type="submit" class="btn btn-pastel-primary">Guardar permisos</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
