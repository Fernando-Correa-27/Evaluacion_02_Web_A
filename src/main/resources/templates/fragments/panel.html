<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<nav th:fragment="menu(activo)" class="sidebar">
    <div class="sidebar-brand">
        <span class="brand-badge"><i class="bi bi-hospital"></i></span>
        <span>Sistema Hospitalario</span>
    </div>

    <div>
        <div class="sidebar-section-title">Principal</div>
        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/dashboard}" th:classappend="${activo == 'dashboard'} ? 'active' : ''">
                    <i class="bi bi-speedometer2"></i> Escritorio
                </a>
            </li>
        </ul>
    </div>

    <div th:if="${session.permisosSesion != null and (#sets.contains(session.permisosSesion, 'USUARIOS:VER') or #sets.contains(session.permisosSesion, 'ROLES:VER') or #sets.contains(session.permisosSesion, 'AREAS:VER') or #sets.contains(session.permisosSesion, 'AUDITORIA:VER'))}">
        <div class="sidebar-section-title">Administración</div>
        <ul class="sidebar-menu">
            <li th:if="${#sets.contains(session.permisosSesion, 'USUARIOS:VER')}">
                <a th:href="@{/usuarios}" th:classappend="${activo == 'usuarios'} ? 'active' : ''">
                    <i class="bi bi-people"></i> Usuarios
                </a>
            </li>
            <li th:if="${#sets.contains(session.permisosSesion, 'ROLES:VER')}">
                <a th:href="@{/roles}" th:classappend="${activo == 'roles'} ? 'active' : ''">
                    <i class="bi bi-patch-check"></i> Roles y Permisos
                </a>
            </li>
            <li th:if="${#sets.contains(session.permisosSesion, 'AREAS:VER')}">
                <a th:href="@{/areas}" th:classappend="${activo == 'areas'} ? 'active' : ''">
                    <i class="bi bi-diagram-3"></i> Áreas
                </a>
            </li>
            <li th:if="${#sets.contains(session.permisosSesion, 'AUDITORIA:VER')}">
                <a th:href="@{/auditoria}" th:classappend="${activo == 'auditoria'} ? 'active' : ''">
                    <i class="bi bi-journal-check"></i> Auditoría
                </a>
            </li>
        </ul>
    </div>
</nav>

<header th:fragment="topbar" class="topbar">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()" aria-hidden="true"></div>
    <button type="button" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Abrir menú" aria-expanded="false">
        <i class="bi bi-list"></i>
    </button>
    <div class="topbar-user">
        <div class="avatar" th:text="${#strings.substring(session.usuarioSesion.nombreCompleto(), 0, 1)}">U</div>
        <div class="user-info">
            <div class="user-name" th:text="${session.usuarioSesion.nombreCompleto()}">Usuario</div>
            <div class="user-role" th:text="${session.usuarioSesion.rol != null} ? ${session.usuarioSesion.rol.nombre} : ''">Rol</div>
        </div>
        <div class="page-actions">
            <a class="btn btn-light-soft" th:href="@{/usuarios/perfil}" title="Mi perfil">
                <i class="bi bi-person-gear"></i>
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-pastel-danger" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i> <span class="logout-label">Salir</span>
                </button>
            </form>
        </div>
    </div>
</header>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <div class="confirm-icon"><i class="bi bi-exclamation-triangle"></i></div>
                    <h5 class="modal-title mb-2">Confirmar acción</h5>
                    <p class="text-muted mb-0" id="confirmMessage">¿Desea continuar?</p>
                </div>
                <div class="modal-footer justify-content-center border-0 pt-0">
                    <button type="button" class="btn btn-outline-pastel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-pastel-danger" id="btnConfirmar">Sí, continuar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ---------- Mobile sidebar drawer ----------
            var sidebar = document.querySelector('.sidebar');
            var toggle = document.querySelector('.sidebar-toggle');
            var backdrop = document.getElementById('sidebarBackdrop');

            function closeSidebar() {
                if (!sidebar || !sidebar.classList.contains('open')) return;
                sidebar.classList.remove('open');
                if (backdrop) backdrop.classList.remove('show');
                if (toggle) toggle.setAttribute('aria-expanded', 'false');
            }

            window.toggleSidebar = function () {
                var isOpen = sidebar.classList.toggle('open');
                if (backdrop) backdrop.classList.toggle('show', isOpen);
                if (toggle) toggle.setAttribute('aria-expanded', String(isOpen));
            };
            window.closeSidebar = closeSidebar;

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeSidebar();
            });

            if (sidebar) {
                sidebar.addEventListener('click', function (e) {
                    if (e.target.closest('a')) closeSidebar();
                });
            }

            // ---------- Confirmation modal for data-confirm forms ----------
            var pendingForm = null;
            var confirmModalEl = document.getElementById('modalConfirmacion');

            document.addEventListener('submit', function (e) {
                var form = e.target;

                if (form.hasAttribute('data-confirm')) {
                    e.preventDefault();
                    document.getElementById('confirmMessage').textContent = form.getAttribute('data-confirm');
                    pendingForm = form;
                    bootstrap.Modal.getOrCreateInstance(confirmModalEl).show();
                    e.stopImmediatePropagation();
                    return;
                }

                [].forEach.call(form.querySelectorAll('button[type="submit"]'), function (btn) {
                    btn.disabled = true;
                    btn.classList.add('is-loading');
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>';
                });
            });

            document.getElementById('btnConfirmar').addEventListener('click', function () {
                if (!pendingForm) return;
                bootstrap.Modal.getInstance(confirmModalEl).hide();
                var form = pendingForm;
                pendingForm = null;
                form.removeAttribute('data-confirm');
                if (typeof form.requestSubmit === 'function') {
                    form.requestSubmit();
                } else {
                    form.submit();
                }
            });

            // ---------- Alerts: announce + dismissible ----------
            document.querySelectorAll('.alert').forEach(function (alertEl) {
                if (alertEl.getAttribute('role') === 'alert') return;
                alertEl.setAttribute('role', 'alert');
                alertEl.classList.add('alert-dismissible', 'fade', 'show');

                var close = document.createElement('button');
                close.type = 'button';
                close.className = 'btn-close';
                close.setAttribute('data-bs-dismiss', 'alert');
                close.setAttribute('aria-label', 'Cerrar');
                alertEl.appendChild(close);
            });
        })();
    </script>
</footer>

</html>
