<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mi perfil')}"></head>
<body>
    <div class="app-layout">
        <nav th:replace="~{fragments/panel :: menu('perfil')}"></nav>
        <div class="app-main">
            <header th:replace="~{fragments/panel :: topbar}"></header>
            <main class="content">
                <div class="page-header">
                    <div>
                        <h1>Mi perfil</h1>
                        <p>Datos de su cuenta y opciones de seguridad</p>
                    </div>
                    <a class="btn btn-outline-pastel" th:href="@{/dashboard}">
                        <i class="bi bi-arrow-left"></i> Volver al escritorio
                    </a>
                </div>

                <div th:if="${exito}" class="alert alert-pastel-success" th:text="${exito}"></div>
                <div th:if="${error}" class="alert alert-pastel-danger" th:text="${error}"></div>

                <div class="row g-3">
                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-title">Datos de la cuenta</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="mb-2"><strong>Usuario:</strong> <span th:text="${usuario.username}"></span></div>
                                    <div class="mb-2"><strong>Nombre:</strong> <span th:text="${usuario.nombreCompleto()}"></span></div>
                                    <div class="mb-2"><strong>DNI:</strong>
                                        <span th:text="${usuario.empleado != null and usuario.empleado.dni != null} ? ${usuario.empleado.dni} : '-'"></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-2"><strong>Rol:</strong>
                                        <span th:text="${usuario.rol != null} ? ${usuario.rol.nombre} : 'Sin rol'"></span>
                                    </div>
                                    <div class="mb-2"><strong>Área:</strong>
                                        <span th:text="${usuario.empleado != null and usuario.empleado.area != null} ? ${usuario.empleado.area.nombre} : 'Sin área'"></span>
                                    </div>
                                    <div class="mb-2"><strong>Correo:</strong>
                                        <span th:text="${usuario.empleado != null and usuario.empleado.correo != null} ? ${usuario.empleado.correo} : '-'"></span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-2"><strong>Fecha de registro:</strong>
                                        <span th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                    <div class="mb-2"><strong>Último acceso:</strong>
                                        <span th:text="${usuario.ultimoAcceso != null} ? ${#temporals.format(usuario.ultimoAcceso, 'dd/MM/yyyy HH:mm')} : 'Nunca'"></span>
                                    </div>
                                    <div class="mb-2"><strong>Estado:</strong>
                                        <span class="badge" th:classappend="${usuario.estado.name() == 'ACTIVO'} ? 'badge-pastel-green' : 'badge-pastel-red'"
                                              th:text="${usuario.estado.name()}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card">
                            <div class="card-title">Cambiar contraseña</div>
                            <form th:action="@{/usuarios/perfil/cambiar-password}" method="post" th:object="${cambioPassword}">
                                <div class="mb-3">
                                    <label class="form-label" for="passwordActual">Contraseña actual</label>
                                    <input type="password" class="form-control" id="passwordActual" th:field="*{passwordActual}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="passwordNueva">Nueva contraseña</label>
                                    <input type="password" class="form-control" id="passwordNueva" th:field="*{passwordNueva}" minlength="6" required>
                                </div>
                                <button type="submit" class="btn btn-pastel-primary w-100">Actualizar contraseña</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
<footer th:replace="~{fragments/panel :: scripts}"></footer>
</html>
